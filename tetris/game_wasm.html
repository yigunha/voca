<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>한국어 학습 게임</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="game-box">
            <div class="loading" id="loadingScreen">
                <div class="loading-spinner"></div>
                <p>게임을 불러오는 중...</p>
            </div>

            <div id="gameContent" class="hidden">
                <div class="main-menu" id="mainMenu">
                    <h2 id="mainMenuTitle">학습 모드 선택</h2>
                    <div class="main-menu-buttons">
                        <button class="main-menu-btn" onclick="selectMainMenu('대화')">대화</button>
                        <button class="main-menu-btn" onclick="selectMainMenu('단어')">단어</button>
                        <button class="main-menu-btn" onclick="selectMainMenu('문법')">문법</button>
                        <button class="main-menu-btn" onclick="selectMainMenu('듣기')">듣기</button>
			 <button class="main-menu-btn" onclick="logout()">로그아웃</button>
                    </div>
                </div>

                <div class="level-selector hidden" id="levelSelector">
                    <div class="level-title" id="levelTitle"></div>
                    <button class="back-btn" onclick="backToMainMenu()">← 메인 메뉴</button>
                    <div class="level-buttons" id="levelButtons"></div>
                </div>

                <div id="gameArea" class="hidden">
                    <div class="description" id="description"></div>
                    
                    <div class="answer-section">
                        <div class="answer-display" id="answerDisplay">
                            <span class="blink">|</span>
                        </div>
                    </div>

                    <div class="target" id="target"></div>
                    
                    <div class="grid-container">
                        <div class="grid" id="grid"></div>
                    </div>
                    
                    <div class="message" id="message"></div>
                    
                    <div class="buttons" id="buttons">
                        <button class="btn btn-start" onclick="startGame()">▶ 게임 시작</button>
                    </div>

                    <div class="answer-header" style="margin-top: 10px;">
                        <button class="show-target-btn" onclick="toggleTarget()">정답</button>
                        <button class="nav-btn" id="prevBtn" onclick="goToPrevProblem()">◀</button>
                        <div class="level level-clickable" id="levelDisplay" onclick="toggleLevelDropdown()">
                            <span id="levelNum">1</span>
                            <div class="level-dropdown hidden" id="levelDropdown"></div>
                        </div>
                        <button class="nav-btn" id="nextBtn" onclick="goToNextProblem()">▶</button>
                        <button class="undo-btn" id="undoBtn" disabled onclick="handleUndo()">↶ 되돌리기</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
